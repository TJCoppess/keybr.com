name: CI

on: [push, pull_request]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Stop at the first failing command on every platform.
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - name: CI
        run: |
          npm ci
          npm run compile
          npm run lint
          npm run stylelint
          npm run build -- --no-stats
          npm run test
        env:
          DATABASE_CLIENT: sqlite
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache